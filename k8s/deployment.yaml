apiVersion: apps/v1
kind: Deployment
metadata:
  name: patchpilot-deployment
  labels:
    app: patchpilot
    tier: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: patchpilot
  template:
    metadata:
      labels:
        app: patchpilot
        tier: api
    spec:
      containers:
        - name: patchpilot
          image: patchpilot:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
